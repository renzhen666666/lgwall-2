<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/css/bootstrap.min.css">
        <link rel="stylesheet" href="/css/aos.css">
        <script src="/js/bootstrap.bundle.min.js"></script>
        <script src="/js/aos.js"></script>
        <link rel="stylesheet" href="/css/main_style.css">
        <link rel="stylesheet" href="/css/component.css">
        <title>加载中 . . .</title>
    </head>
    <body>
        <section id="nav">

        </section>

        <section id="menu">

        </section>

        <main id="app" class="root">

        </main>

        <div class="modal fade" id="notice" tabindex="-1" aria-labelledby="noticeLabel" aria-hidden="true">
            <div class="modal-dialog" style="max-height: 500px;overflow: auto;">
                <div class="modal-content">
                    <div class="modal-header">
                        <h4 class="modal-title" id="noticeLabel">公告</h4>
                    </div>
                    <div class="modal-body" id="notice-content">
                        <div class="text-center">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">加载中...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>


        <!--图片视频模态框-->
        <div id="mediaModal" class="image-modal-overlay" onclick="handleOverlayClick(event)">
            <div class="modal-content-wrapper">
                <!-- 关闭按钮 -->
                <button class="modal-close-btn" onclick="closeModal()" aria-label="关闭">&times;</button>
                
                <!-- 左箭头 -->
                <button id="prevBtn" class="nav-btn prev-btn" onclick="changeMedia(-1)" aria-label="上一个">
                    &#10094;
                </button>

                <!-- 媒体容器 (图片或视频将在这里渲染) -->
                <div class="media-container" id="mediaContainer">
                    <!-- 动态插入内容 -->
                </div>

                <!-- 右箭头 -->
                <button id="nextBtn" class="nav-btn next-btn" onclick="changeMedia(1)" aria-label="下一个">
                    &#10095;
                </button>
                
                <!-- 底部信息 -->
                <div class="modal-info-bar">
                    <div class="modal-text-group">
                        <div id="modalTitle" class="modal-title"></div>
                        <div id="modalDesc" class="modal-desc"></div>
                    </div>
                    <div id="modalCounter" class="modal-counter">1 / 5</div>
                </div>
            </div>
        </div>


        <script src="/config.js"></script>
        <script src="/js/component.js"></script>
        <script src="/js/main.js"></script>
        <script src="/frame.js"></script>
    </body>
</html>
